<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VirtualDisplay WebRTC</title><style>html,body{margin:0;height:100%;background:#111}video{width:100%;height:100%;object-fit:contain;background:#000}</style></head><body><video id="v" autoplay playsinline controls></video><script>
(async()=>{const v=document.getElementById('v');const pc=new RTCPeerConnection({iceServers:[]});pc.addTransceiver('video',{direction:'recvonly'});pc.ontrack=e=>v.srcObject=e.streams[0];const offer=await pc.createOffer();await pc.setLocalDescription(offer);if(pc.iceGatheringState!=='complete')await new Promise(r=>pc.addEventListener('icegatheringstatechange',()=>pc.iceGatheringState==='complete'&&r(),{once:true}));const r=await fetch('/offer',{method:'POST',headers:{'Content-Type':'application/sdp'},body:pc.localDescription.sdp});if(!r.ok)throw new Error(await r.text());await pc.setRemoteDescription({type:'answer',sdp:await r.text()})})().catch(e=>document.body.insertAdjacentHTML('beforeend','<pre style="color:#f66">'+e+'</pre>'));
</script></body></html>
